<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de reservas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body class="form">
    <header>
        <h1>Reserva tu bicicleta!</h1>
        <p>Completa el formulario para asegurar tu recorrido.</p>
    </header>

    <main>
        <section class="contenedor-formulario">
            <form class="formulario-reserva">

                <div class="grupo">
                    <div class="card">
                        <h3>Datos personales</h3>
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" required>

                        <label for="email">Correo:</label>
                        <input type="email" name="email" id="email" required>

                        <label for="tel">Teléfono celular:</label>
                        <input type="tel" id="tel" name="telefono" required>
                    </div>
                </div>

                <div class="grupo">
                    <div class="card">
                        <h3>Fecha y hora</h3>
                        <label for="date">Fecha:</label>
                        <input type="date" name="date" id="date">
                        <label for="hora">Hora:</label>
                        <input type="time" name="hora" id="hora">
                    </div>
                </div>

                <div class="grupo">
                    <div class="card">
                        <h3>Recorrido</h3>
                        <label for="recorrido">Recorrido:</label>
                        <select id="recorrido" name="recorrido" required>
                            <option value="" disabled selected>Selecciona uno </option>
                            <option value="rioparques">Río y parques</option>
                            <option value="barrio">Sabores de barrio</option>
                            <option value="palmas">Reto Las Palmas</option>
                        </select>
                    </div>
                </div>

                <div class="grupo">
                    <div class="card">
                        <h3>Bicicleta</h3>
                        <label for="bicicleta">Selecciona el tipo de bicicleta:</label>
                        <select name="bicicleta" id="bicicleta" required>
                            <option value="">Selecciona una...</option>
                            <option value="urbana">Urbana</option>
                            <option value="montaña">Montaña</option>
                            <option value="electrica">Eléctrica</option>
                        </select>
                    </div>
                </div>

                <div class="grupo">
                    <div class="card">
                        <h3>Observaciones</h3>
                        <label for="observaciones">¿Tienes alguna observación?</label>
                        <input type="text" id="observaciones" name="observaciones">
                    </div>
                </div>

                <button class="submit" type="submit">Reservar</button>

            </form>
        </section>
    </main>

    <footer>
        <button type="button" onclick="window.location.href='./index.html'">Volver a inicio
        </button>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
</body>

</html>
